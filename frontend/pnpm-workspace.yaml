# The first glob comes with the workspace, the others are written by the Nx generators - a new
# project in a folder that is not covered yet appends a line here. Every folder that matches gets
# its own node_modules with exactly the dependencies its package.json declares - nothing else is
# reachable.
packages:
  - 'apps/*'
  - 'packages/employees/*'
  - 'packages/shared/*'
  - 'packages/absences/*'

autoInstallPeers: true

# pnpm blocks install scripts of dependencies unless they are decided here. The first three lines
# are written by Nx - Vite 8 does not use esbuild any more, so its install script is not needed.
# oxlint and oxfmt unpack a native binary and genuinely need theirs; everything else stays blocked,
# which is the point. `pnpm approve-builds` maintains the list.
allowBuilds:
  nx: true
  '@swc/core': false
  esbuild: false
  oxlint: true
  oxfmt: true

# pnpm is installed by mise at the version mise.lock pins, see mise.toml in the repository root.
# The notice that a newer pnpm exists, and the `pnpm self-update` it suggests, do not apply.
updateNotifier: false

minimumReleaseAgeExclude:
  - '@storybook/builder-vite@10.5.9'
  - '@storybook/csf-plugin@10.5.9'
  - '@storybook/react-dom-shim@10.5.9'
  - '@storybook/react-vite@10.5.9'
  - '@storybook/react@10.5.9'
  - storybook@10.5.9
  - '@nx/devkit@23.2.0'
  # Transitive implementation packages used by Nx 23.2 integrations; the workspace does not run
  # the ESLint CLI or keep an ESLint configuration.
  - '@nx/eslint-plugin@23.2.0'
  - '@nx/eslint@23.2.0'
  - '@nx/js@23.2.0'
  - '@nx/nx-darwin-arm64@23.2.0'
  - '@nx/nx-darwin-x64@23.2.0'
  - '@nx/nx-freebsd-x64@23.2.0'
  - '@nx/nx-linux-arm-gnueabihf@23.2.0'
  - '@nx/nx-linux-arm64-gnu@23.2.0'
  - '@nx/nx-linux-arm64-musl@23.2.0'
  - '@nx/nx-linux-x64-gnu@23.2.0'
  - '@nx/nx-linux-x64-musl@23.2.0'
  - '@nx/nx-win32-arm64-msvc@23.2.0'
  - '@nx/nx-win32-x64-msvc@23.2.0'
  - '@nx/oxlint@23.2.0'
  - '@nx/playwright@23.2.0'
  - '@nx/react@23.2.0'
  - '@nx/vite@23.2.0'
  - '@nx/vitest@23.2.0'
  - '@nx/web@23.2.0'
  - '@nx/workspace@23.2.0'
  - nx@23.2.0
